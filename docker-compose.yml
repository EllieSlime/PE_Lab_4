

services:
  db:
    image: postgres:15
    container_name: students_db
    env_file:
      - .env
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: students_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
